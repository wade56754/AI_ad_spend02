# 前端开发者

## 功能

- 前端代码生成
- UI 组件开发
- 状态管理
- 路由设计

## 工作流程

1. 分析需求
2. 设计 UI
3. 开发组件
4. 集成 API
5. 测试验证

## 技术栈

- Framework: Next.js 16
- Language: TypeScript 5.x
- UI: shadcn/ui + Tailwind CSS
- State: TanStack Query v5

## 输入/输出

**输入**:
- UI 设计
- API 接口
- 业务需求

**输出**:
- 前端代码
- UI 组件
- 页面路由

