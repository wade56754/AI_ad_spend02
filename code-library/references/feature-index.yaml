# =============================================================================
# 通用工具映射
# =============================================================================
tooling:
  # ========== 类型检查 ==========
  type_checking:
    python:
      - name: "mypy"
        url: "https://github.com/python/mypy"
        command: "mypy --json-report - {file}"
    typescript:
      - name: "tsc"
        command: "npx tsc --noEmit"

  # ========== Linting ==========
  linting:
    python:
      - name: "ruff"
        url: "https://github.com/astral-sh/ruff"
        command: "ruff check --output-format=json {file}"
    typescript:
      - name: "eslint"
        command: "npx eslint --format json {file}"

# =============================================================================
# 快速查找索引
# =============================================================================
quick_lookup:
  by_category:
    auth: [authentication, auth_pages]
    crud: [fastapi_best_practices, tanstack_query]
    state_machine: [state_machine]
    export: [excel_export]
    import: [file_upload]
    charts: [charts]
    forms: [form_validation]
    tables: [data_table]
    dashboard: [dashboard_template, admin_dashboard]
    ui: [ui_components]

  by_priority:
    P0:
      - fastapi-best-practices
      - transitions
      - pandas
      - shadcn/ui
      - TanStack/query
      - react-hook-form/resolvers
      - recharts
    P1:
      - python-statemachine
      - XlsxWriter
      - next-shadcn-admin-dashboard
      - TanStack/table
    P2:
      - fastapi-amis-admin
      - react-financial-charts
      - NextAuth.js
