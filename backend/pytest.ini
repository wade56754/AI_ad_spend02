[pytest]
# pytest配置文件

# 测试路径
testpaths = tests

# Python路径
pythonpath = .

# 模块导入模式（避免相对导入问题）
import_mode = append

# 自动发现要测试的文件和函数
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 输出选项
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --cov=.
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=60
    --asyncio-mode=auto

# 标记定义
markers =
    unit: 单元测试（快速，不依赖外部服务）
    integration: 集成测试（涉及数据库等外部依赖）
    e2e: 端到端测试（完整的业务流程）
    slow: 慢速测试（运行时间>1秒）
    auth: 认证相关测试
    permissions: 权限相关测试（RBAC）
    api: API接口测试
    service: 服务层测试
    excel: Excel导入/导出测试
    project: 项目管理测试
    daily_report: 日报管理测试
    topup: 充值管理测试
    reconciliation: 对账管理测试
    ai_analytics: AI分析测试

# 过滤警告
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# 最小版本要求
minversion = 6.0