# ========== Excel / 数据导出 ==========
excel_export:
  - id: "excel-001"
    name: "FastAPI Excel Export Example"
    github: "https://github.com/tiangolo/fastapi"
    license: "MIT"
    language: "Python"
    description: "FastAPI 官方示例 - 文件响应和流式下载"
    use_cases:
      - "StreamingResponse 流式文件下载"
      - "FileResponse 静态文件响应"
      - "Background Tasks 异步生成"
    key_files:
      - "docs_src/response/tutorial004.py"
      - "docs_src/background_tasks/"
    tags: ["export", "download", "excel", "streaming", "fastapi"]
    compatibility:
      python_version: ">=3.8"
      relevant_for: ["backend", "api"]
    priority: "P0"
    code_example: |
      from fastapi import FastAPI
      from fastapi.responses import StreamingResponse
      import io
      import openpyxl

      @app.get("/export/excel")
      async def export_excel():
          wb = openpyxl.Workbook()
          ws = wb.active
          ws.append(["Column1", "Column2"])
          ws.append(["Data1", "Data2"])

          output = io.BytesIO()
          wb.save(output)
          output.seek(0)

          return StreamingResponse(
              output,
              media_type="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
              headers={"Content-Disposition": "attachment; filename=export.xlsx"}
          )

  - id: "excel-002"
    name: "openpyxl"
    github: "https://github.com/theorchard/openpyxl"
    license: "MIT"
    language: "Python"
    description: "Python Excel 读写库 (xlsx 格式)"
    use_cases:
      - "Excel 文件创建和修改"
      - "样式和格式设置"
      - "公式支持"
      - "图表生成"
    key_files:
      - "openpyxl/workbook/"
      - "openpyxl/worksheet/"
      - "openpyxl/styles/"
    tags: ["excel", "xlsx", "export", "import", "spreadsheet"]
    compatibility:
      python_version: ">=3.6"
      relevant_for: ["backend"]
    priority: "P0"
    code_example: |
      from openpyxl import Workbook
      from openpyxl.styles import Font, Alignment, Border, Side

      wb = Workbook()
      ws = wb.active
      ws.title = "Report"

      # 设置表头样式
      header_font = Font(bold=True)
      for col, header in enumerate(["日期", "消耗", "转化"], 1):
          cell = ws.cell(row=1, column=col, value=header)
          cell.font = header_font

      # 写入数据
      for row_idx, data in enumerate(records, 2):
          ws.cell(row=row_idx, column=1, value=data["date"])
          ws.cell(row=row_idx, column=2, value=data["spend"])

      wb.save("report.xlsx")

  - id: "excel-003"
    name: "XlsxWriter"
    github: "https://github.com/jmcnamara/XlsxWriter"
    stars: "3500+"
    license: "BSD-2-Clause"
    language: "Python"
    description: "高性能 Excel 写入库 (仅写入)"
    use_cases:
      - "大数据量 Excel 生成"
      - "内存优化模式"
      - "丰富的格式支持"
      - "图表和图像"
    key_files:
      - "xlsxwriter/workbook.py"
      - "xlsxwriter/worksheet.py"
    tags: ["excel", "xlsx", "export", "high-performance", "streaming"]
    compatibility:
      python_version: ">=3.6"
      relevant_for: ["backend", "batch-export"]
    priority: "P1"
    code_example: |
      import xlsxwriter
      from io import BytesIO

      output = BytesIO()
      workbook = xlsxwriter.Workbook(output, {'in_memory': True})
      worksheet = workbook.add_worksheet()

      # 格式
      header_format = workbook.add_format({'bold': True, 'bg_color': '#D7E4BC'})

      # 写入表头
      headers = ["日期", "项目", "消耗", "转化"]
      for col, header in enumerate(headers):
          worksheet.write(0, col, header, header_format)

      # 写入数据 (支持大数据量)
      for row, record in enumerate(data, 1):
          worksheet.write_row(row, 0, record)

      workbook.close()
      output.seek(0)

  - id: "excel-004"
    name: "pandas to_excel"
    github: "https://github.com/pandas-dev/pandas"
    stars: "43000+"
    license: "BSD-3-Clause"
    language: "Python"
    description: "Pandas DataFrame 导出 Excel"
    use_cases:
      - "DataFrame 直接导出"
      - "多 Sheet 支持"
      - "与数据分析无缝集成"
    tags: ["excel", "export", "pandas", "dataframe"]
    compatibility:
      python_version: ">=3.9"
      relevant_for: ["backend", "data-analysis"]
    priority: "P0"
    code_example: |
      import pandas as pd
      from io import BytesIO

      # 从数据库查询转 DataFrame
      df = pd.DataFrame(records)

      # 导出到内存
      output = BytesIO()
      with pd.ExcelWriter(output, engine='openpyxl') as writer:
          df.to_excel(writer, sheet_name='日报', index=False)

          # 设置列宽
          worksheet = writer.sheets['日报']
          for i, col in enumerate(df.columns):
              worksheet.column_dimensions[chr(65 + i)].width = 15

      output.seek(0)

