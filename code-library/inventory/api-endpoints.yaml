        query_params: [start, end]
        response_status: 200
      - method: GET
        path: /reports/{project_id}
        summary: 获取单个项目报表（向后兼容）
        permissions: authenticated
        path_params: [project_id]
        query_params: [start, end]
        response_status: 200

  # ============================================================
  # 16. Agents (AI Agent 管理)
  # ============================================================
  agents:
    prefix: /agents
    tags: ["agents"]
    file: backend/routers/agents.py
    state_machine: "created → running → stopped/error"
    endpoints:
      - method: GET
        path: /agents
        summary: 获取 Agent 列表
        permissions: authenticated
        query_params: [page, page_size, status, agent_type]
        response_status: 200
      - method: GET
        path: /agents/{agent_id}
        summary: 获取 Agent 详情
        permissions: authenticated
        path_params: [agent_id]
        response_status: 200
      - method: POST
        path: /agents
        summary: 创建 Agent
        permissions: authenticated
        response_status: 201
      - method: PUT
        path: /agents/{agent_id}
        summary: 更新 Agent
        permissions: authenticated
        path_params: [agent_id]
        response_status: 200
      - method: DELETE
        path: /agents/{agent_id}
        summary: 删除 Agent
        permissions: authenticated
        path_params: [agent_id]
        response_status: 200
      - method: POST
        path: /agents/{agent_id}/start
        summary: 启动 Agent
        permissions: authenticated
        path_params: [agent_id]
        state_transition: "created/stopped → running"
        response_status: 200
      - method: POST
        path: /agents/{agent_id}/stop
        summary: 停止 Agent
        permissions: authenticated
        path_params: [agent_id]
        state_transition: "running → stopped"
        response_status: 200

