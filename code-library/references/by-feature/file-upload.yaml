# 外部参考项目
external_references:
  - id: "upload-001"
    name: "FastAPI File Upload"
    github: "https://fastapi.tiangolo.com/tutorial/request-files/"
    description: "FastAPI 官方文件上传教程"
    tech_stack:
      - "FastAPI"
      - "python-multipart"
    features:
      - "单文件上传"
      - "多文件上传"
      - "文件验证"
    code_example: |
      from fastapi import File, UploadFile

      @router.post("/upload")
      async def upload_file(file: UploadFile = File(...)):
          # 验证文件类型
          allowed_types = ["application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"]
          if file.content_type not in allowed_types:
              raise HTTPException(400, "Invalid file type")

          # 验证文件大小 (10MB limit)
          contents = await file.read()
          if len(contents) > 10 * 1024 * 1024:
              raise HTTPException(400, "File too large")

          # 处理文件
          return {"filename": file.filename, "size": len(contents)}

  - id: "upload-002"
    name: "Chunked Upload"
    description: "大文件分片上传方案"
    features:
      - "断点续传"
      - "进度追踪"
      - "并发上传"
    code_example: |
      # 前端分片
      const CHUNK_SIZE = 1024 * 1024; // 1MB

      async function uploadChunked(file: File) {
        const totalChunks = Math.ceil(file.size / CHUNK_SIZE);
        const uploadId = crypto.randomUUID();

        for (let i = 0; i < totalChunks; i++) {
          const chunk = file.slice(i * CHUNK_SIZE, (i + 1) * CHUNK_SIZE);
          await uploadChunk(uploadId, i, chunk, totalChunks);
        }

        await finalizeUpload(uploadId);
      }

