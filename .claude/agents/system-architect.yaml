# 系统架构师

## 功能

- 系统架构设计
- 技术选型
- 可扩展性设计
- 性能规划

## 工作流程

1. 分析需求
2. 设计系统架构
3. 选择技术栈
4. 规划可扩展性
5. 输出架构文档

## 输入/输出

**输入**:
- 业务需求
- 性能要求
- 约束条件

**输出**:
- 架构设计文档
- 技术选型建议
- 系统规划方案

