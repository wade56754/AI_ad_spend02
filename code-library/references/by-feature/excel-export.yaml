# 外部参考项目
external_references:
  - id: "excel-001"
    name: "FastAPI Excel Response"
    github: "https://github.com/jmcnamara/XlsxWriter"
    description: "XlsxWriter - Python Excel 写入库"
    stars: "3500+"
    license: "BSD-2-Clause"
    tech_stack:
      - "Python >= 3.6"
      - "XlsxWriter"
    features:
      - "基础 Excel 生成"
      - "自定义格式"
      - "图表支持"
      - "大文件支持 (constant memory mode)"
    code_example: |
      import xlsxwriter
      from fastapi.responses import StreamingResponse
      from io import BytesIO

      def export_to_excel(data: list[dict]) -> StreamingResponse:
          output = BytesIO()
          workbook = xlsxwriter.Workbook(output, {'in_memory': True})
          worksheet = workbook.add_worksheet()

          # 写入表头
          headers = list(data[0].keys()) if data else []
          for col, header in enumerate(headers):
              worksheet.write(0, col, header)

          # 写入数据
          for row_num, row_data in enumerate(data, 1):
              for col, key in enumerate(headers):
                  worksheet.write(row_num, col, row_data.get(key))

          workbook.close()
          output.seek(0)

          return StreamingResponse(
              output,
              media_type="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
              headers={"Content-Disposition": "attachment; filename=export.xlsx"}
          )
    adaptation_notes: |
      1. 需要添加项目标准响应头
      2. 需要集成权限检查
      3. 需要添加分页/限制 (MAX_EXPORT_ROWS)
      4. 使用项目列名映射配置

  - id: "excel-002"
    name: "openpyxl"
    github: "https://github.com/theorchard/openpyxl"
    description: "Python Excel 读写库 (xlsx)"
    stars: "4500+"
    license: "MIT"
    tech_stack:
      - "Python >= 3.6"
      - "openpyxl"
    features:
      - "读写 xlsx 文件"
      - "样式和格式"
      - "图表"
      - "公式"
    code_example: |
      from openpyxl import Workbook
      from openpyxl.utils.dataframe import dataframe_to_rows
      import pandas as pd

      def export_dataframe(df: pd.DataFrame) -> bytes:
          wb = Workbook()
          ws = wb.active

          for r in dataframe_to_rows(df, index=False, header=True):
              ws.append(r)

          from io import BytesIO
          output = BytesIO()
          wb.save(output)
          return output.getvalue()

  - id: "excel-003"
    name: "pandas to_excel"
    github: "https://github.com/pandas-dev/pandas"
    description: "pandas 内置 Excel 导出"
    features:
      - "DataFrame.to_excel()"
      - "多 sheet 支持"
      - "样式 (需要 openpyxl)"
    code_example: |
      import pandas as pd
      from io import BytesIO

      def export_with_pandas(data: list[dict]) -> bytes:
          df = pd.DataFrame(data)
          output = BytesIO()
          df.to_excel(output, index=False, engine='openpyxl')
          return output.getvalue()

