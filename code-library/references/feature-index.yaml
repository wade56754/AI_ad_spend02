        key_concepts:
          - "before_insert/update/delete 事件"
          - "ORM 生命周期钩子"
      - name: "sqlalchemy-continuum"
        url: "https://github.com/kvesteri/sqlalchemy-continuum"
        stars: "600+"
        license: "BSD"
        relevance: "P2"
        key_concepts:
          - "自动版本历史"
          - "变更追踪"

