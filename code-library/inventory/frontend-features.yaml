  # ========== 日报模块 ==========
  daily_reports:
    - name: "日报列表 Hook"
      description: "TanStack Query v5 分页查询 + 状态管理"
      files:
        - frontend/src/modules/daily-reports/hooks/useDailyReports.ts
      status: completed
      reusable: true
      tags: [hook, query, pagination, tanstack-query]
      patterns:
        - "useQuery 分页查询"
        - "useMutation CRUD 操作"
        - "queryClient.invalidateQueries 缓存失效"
        - "乐观更新 (setQueryData)"
      code_examples:
        list_query: |
          export function useDailyReports(params: DailyReportListParams = {}) {
            return useQuery({
              queryKey: queryKeys.dailyReports.list(params),
              queryFn: () => getDailyReports(params),
            });
          }
        mutation: |
          export function useCreateDailyReport() {
            const queryClient = useQueryClient();
            return useMutation({
              mutationFn: createDailyReport,
              onSuccess: () => {
                queryClient.invalidateQueries({ queryKey: queryKeys.dailyReports.all });
              },
            });
          }

    - name: "日报 API 服务"
      description: "封装后端 API 调用"
