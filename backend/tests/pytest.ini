[tool:pytest]
# 测试发现
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# pytest-asyncio 配置
# 使用 auto 模式，自动为 async def test_* 添加 asyncio 标记
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# 输出配置
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# 标记定义 (SoT Ref: AUTOMATION_TEST_SPEC_v1.4.md 第 2 章)
markers =
    unit: L0 单元测试 - 无外部依赖，执行速度 < 100ms
    integration: L1 集成测试 - 使用测试数据库，执行速度 < 500ms
    api: L2 API 测试 - HTTP 接口测试，执行速度 < 1s
    e2e: L3 端到端测试 - 完整业务流程，执行速度 < 5s
    performance: 性能测试
    security: 安全测试
    slow: 慢速测试（可能耗时较长）
    asyncio: 异步测试标记
    smoke: 冒烟测试 - 快速验证核心功能

# 最小版本要求
minversion = 6.0

# 过滤警告
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning
