  # ========== TanStack Query ==========
  tanstack_query:
    local_need: "服务端状态管理 (数据获取/缓存)"
    local_files:
      - frontend/src/features/*/hooks/
      - frontend/src/features/*/services/
      - frontend/src/lib/api.ts
    github_refs:
      - name: "TanStack/query"
        url: "https://github.com/TanStack/query"
        stars: "42000+"
        license: "MIT"
        relevance: "P0 - 已集成"
        key_concepts:
          - "useQuery / useMutation"
          - "queryKey 管理"
          - "乐观更新"
          - "缓存失效"
          - "Suspense 支持"
        best_practices:
          - "自定义 Hook 封装查询"
          - "queryOptions 共享配置"
          - "select 数据转换"
          - "垂直切片目录结构"

  # ========== 表单验证 ==========
  form_validation:
    local_need: "表单验证 (React Hook Form + Zod)"
    local_files:
      - frontend/src/features/*/components/*Form.tsx
    github_refs:
      - name: "react-hook-form/resolvers"
        url: "https://github.com/react-hook-form/resolvers"
        stars: "1500+"
        license: "MIT"
        relevance: "P0 - 已集成"
        key_concepts:
          - "zodResolver 集成"
          - "类型安全表单"
          - "Schema 到类型推断"
        code_example: |
          import { z } from 'zod';
          import { useForm } from 'react-hook-form';
          import { zodResolver } from '@hookform/resolvers/zod';

          const schema = z.object({
            email: z.string().email('请输入有效邮箱'),
            amount: z.number().min(0, '金额必须大于0'),
          });

          type FormData = z.infer<typeof schema>;

          function MyForm() {
            const { register, handleSubmit, formState: { errors } } = useForm<FormData>({
              resolver: zodResolver(schema),
            });
            // ...
          }

