# ========== 前端模式库 ==========
patterns:
  module_structure:
    description: "标准模块目录结构"
    template: |
      modules/{module-name}/
      ├── index.ts              # 模块导出
      ├── hooks/
      │   ├── index.ts
      │   └── use{Module}.ts    # TanStack Query Hooks
      ├── services/
      │   ├── index.ts
      │   └── {module}Api.ts    # API 调用封装
      └── types/
          ├── index.ts
          └── {module}.types.ts # TypeScript 类型

  query_hook:
    description: "TanStack Query v5 查询 Hook 模式"
    template: |
      export function use{Entity}s(params = {}) {
        return useQuery({
          queryKey: queryKeys.{entity}s.list(params),
          queryFn: () => get{Entity}s(params),
        });
      }

  mutation_hook:
    description: "TanStack Query v5 变更 Hook 模式"
    template: |
      export function useCreate{Entity}() {
        const queryClient = useQueryClient();
        return useMutation({
          mutationFn: create{Entity},
          onSuccess: () => {
            queryClient.invalidateQueries({ queryKey: queryKeys.{entity}s.all });
          },
        });
      }

  api_service:
    description: "API 服务调用模式"
    template: |
      const BASE_PATH = '/api/v1/{entities}';

      export async function get{Entity}s(params = {}): Promise<PaginatedResponse<{Entity}>> {
        const searchParams = new URLSearchParams();
        // ... build params
        return apiFetchPaginated<{Entity}>(`${BASE_PATH}?${searchParams}`);
      }

