[pytest]
# pytest 配置 - Agent Layer 测试
# 日常开发只运行 agents/tests 下的测试

pythonpath = .

# 默认测试路径（只运行新版测试）
testpaths =
    agents/tests

# 排除的目录
norecursedirs = .git __pycache__ .pytest_cache node_modules tests/agents_legacy

# 默认选项
addopts = -v --tb=short

# 最小版本要求
minversion = 6.0

# 测试发现模式
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# 测试标记
markers =
    unit: 单元测试
    integration: 集成测试
    smoke: 冒烟测试
    slow: 慢速测试
    legacy: Legacy 测试（依赖旧实现，需要更新）

# 过滤警告
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning

# 日志配置
log_cli = false
log_cli_level = WARNING

# 超时配置（秒）
timeout = 300
