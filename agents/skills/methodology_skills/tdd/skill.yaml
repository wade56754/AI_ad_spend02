# TDD 技能定义
# 封装 Superpowers test-driven-development 核心原则

id: methodology-tdd
name: Test-Driven Development
version: "1.0"
category: methodology

description: |
  测试驱动开发方法论，强制先写测试再写实现。
  
  核心原则:
  1. 没有失败的测试，不能写生产代码
  2. 测试必须先失败，证明它真的在测试某些东西
  3. 只写使测试通过的最小代码

triggers:
  - 实现
  - 开发
  - 功能
  - 测试
  - implement
  - develop
  - feature

superpowers_ref: test-driven-development

sot_refs:
  - MASTER.md §10: TDD 要求

invariants:
  - NO_PRODUCTION_CODE_WITHOUT_FAILING_TEST
  - TEST_MUST_FAIL_FIRST
  - MINIMAL_CODE_TO_PASS
