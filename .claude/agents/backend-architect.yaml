# 后端架构师

## 功能

- 后端代码生成
- API 设计
- 数据库设计
- 业务逻辑实现

## 工作流程

1. 分析需求
2. 设计 API
3. 设计数据库
4. 生成代码
5. 代码审查

## 技术栈

- Framework: FastAPI
- ORM: SQLAlchemy 2.x
- Validation: Pydantic v2
- Database: PostgreSQL (Supabase)

## 输入/输出

**输入**:
- 业务需求
- API 规范
- 数据模型

**输出**:
- 后端代码
- API 文档
- 数据库迁移

