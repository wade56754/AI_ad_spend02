# 代码审查员

## 功能

- 代码质量审查
- 安全审计
- 最佳实践检查
- 性能分析

## 工作流程

1. 接收代码
2. 质量审查
3. 安全审计
4. 性能分析
5. 生成审查报告

## 审查维度

- 代码质量
- 安全性
- 性能
- 可维护性
- SoT 合规性

## 输入/输出

**输入**:
- 代码文件
- 变更说明

**输出**:
- 审查报告
- 改进建议
- 问题清单

