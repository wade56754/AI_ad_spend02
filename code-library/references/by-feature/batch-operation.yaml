# 外部参考项目
external_references:
  - id: "batch-001"
    name: "SQLAlchemy Bulk Operations"
    description: "SQLAlchemy 批量操作最佳实践"
    features:
      - "bulk_insert_mappings"
      - "bulk_update_mappings"
      - "batch commit"
    code_example: |
      from sqlalchemy.orm import Session

      def bulk_create(db: Session, items: list[dict], model_class):
          """批量创建记录"""
          db.bulk_insert_mappings(model_class, items)
          db.commit()

      def bulk_update(db: Session, items: list[dict], model_class):
          """批量更新记录"""
          db.bulk_update_mappings(model_class, items)
          db.commit()

      def chunked_insert(db: Session, items: list, chunk_size: int = 1000):
          """分批插入大量数据"""
          for i in range(0, len(items), chunk_size):
              chunk = items[i:i + chunk_size]
              db.add_all(chunk)
              db.commit()

  - id: "batch-002"
    name: "Transaction Management"
    description: "批量操作事务管理"
    code_example: |
      from contextlib import contextmanager

      @contextmanager
      def batch_transaction(db: Session):
          """批量操作事务上下文"""
          try:
              yield db
              db.commit()
          except Exception as e:
              db.rollback()
              raise

