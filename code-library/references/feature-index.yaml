# 功能索引表：本地需求 → GitHub 参考
# 版本: v1.0
# 更新日期: 2025-12-19
# 用途: 代码工厂根据本地需求快速找到 GitHub 参考实现

version: "1.0"
updated: "2025-12-19"
description: "本地功能需求与 GitHub 开源参考的映射表"

# =============================================================================
# 后端功能映射
# =============================================================================
backend:
  # ========== 核心架构 ==========
  fastapi_best_practices:
    local_need: "FastAPI 项目结构和最佳实践"
    local_files:
      - backend/routers/
      - backend/services/
      - backend/core/
    github_refs:
      - name: "zhanymkanov/fastapi-best-practices"
        url: "https://github.com/zhanymkanov/fastapi-best-practices"
        stars: "10000+"
        license: "MIT"
        relevance: "P0 - 核心参考"
        key_concepts:
          - "依赖注入验证数据"
          - "async/sync 处理策略"
          - "项目结构规范"
      - name: "modern-python/fastapi-sqlalchemy-template"
        url: "https://github.com/modern-python/fastapi-sqlalchemy-template"
        stars: "500+"
        license: "MIT"
        relevance: "P0 - 生产就绪"
        key_concepts:
          - "异步 SQLAlchemy 2.0"
          - "依赖注入容器 (modern-di)"
          - "pytest 自动回滚"
      - name: "Aeternalis-Ingenium/FastAPI-Backend-Template"
        url: "https://github.com/Aeternalis-Ingenium/FastAPI-Backend-Template"
        stars: "500+"
        license: "MIT"
        relevance: "P1"
        key_concepts:
          - "异步 PostgreSQL"
          - "Alembic 迁移"
          - "Docker 容器化"

  # ========== 状态机 ==========
  state_machine:
    local_need: "8 状态机流转 (日报/充值/转账/对账)"
    local_files:
      - backend/core/state_machine.py
      - backend/models/enums.py
      - backend/services/daily_report_service.py
      - backend/services/topup_service.py
    github_refs:
      - name: "pytransitions/transitions"
        url: "https://github.com/pytransitions/transitions"
        stars: "5500+"
        license: "MIT"
        relevance: "P0 - 推荐"
        key_concepts:
          - "轻量级有限状态机"
          - "状态/转换/回调"
          - "Mermaid 图表生成"
          - "静态类型支持 (2024)"
        code_example: |
          from transitions import Machine

          class TopupWorkflow:
              states = ['draft', 'pending_review', 'approved', 'paid', 'completed']

              def __init__(self):
                  self.machine = Machine(
                      model=self,
                      states=self.states,
                      initial='draft'
                  )
                  self.machine.add_transition('submit', 'draft', 'pending_review')
                  self.machine.add_transition('approve', 'pending_review', 'approved')
                  self.machine.add_transition('pay', 'approved', 'paid')
                  self.machine.add_transition('complete', 'paid', 'completed')
      - name: "fgmacedo/python-statemachine"
        url: "https://github.com/fgmacedo/python-statemachine"
        stars: "800+"
        license: "MIT"
        relevance: "P1"
        key_concepts:
          - "声明式状态定义"
          - "条件表达式 (Boolean 代数)"
          - "依赖注入回调"
          - "asyncio 原生支持"
          - "图表自动生成"
        code_example: |
          from statemachine import StateMachine, State

          class TopupStateMachine(StateMachine):
              draft = State(initial=True)
              pending_review = State()
              approved = State()
              paid = State()
              completed = State(final=True)

              submit = draft.to(pending_review)
              approve = pending_review.to(approved)
              pay = approved.to(paid)
              complete = paid.to(completed)

  # ========== Excel 导入导出 ==========
  excel_export:
    local_need: "日报/对账批量导出 Excel"
    local_files:
      - backend/routers/daily_reports.py
      - backend/config/excel_column_mapping.py
    github_refs:
      - name: "pandas to_excel"
        url: "https://github.com/pandas-dev/pandas"
        stars: "43000+"
        license: "BSD-3-Clause"
        relevance: "P0 - 推荐"
        key_concepts:
          - "DataFrame 直接导出"
          - "多 Sheet 支持"
          - "样式和格式化"
      - name: "jmcnamara/XlsxWriter"
        url: "https://github.com/jmcnamara/XlsxWriter"
        stars: "3500+"
        license: "BSD-2-Clause"
        relevance: "P1 - 高性能"
        key_concepts:
          - "大数据量内存优化"
          - "图表生成"
          - "条件格式"
      - name: "theorchard/openpyxl"
        url: "https://github.com/theorchard/openpyxl"
        stars: "2800+"
        license: "MIT"
        relevance: "P0 - 推荐"
        key_concepts:
          - "读写 xlsx"
          - "样式/公式/图表"
          - "流式读取大文件"

  # ========== Admin Dashboard ==========
  admin_dashboard:
    local_need: "后端管理界面 (可选)"
    local_files: []
    github_refs:
      - name: "amisadmin/fastapi-amis-admin"
        url: "https://github.com/amisadmin/fastapi-amis-admin"
        stars: "1200+"
        license: "Apache-2.0"
        relevance: "P2"
        key_concepts:
          - "类 Django Admin"
          - "FastCRUD 自动生成"
          - "amis 低代码前端"
      - name: "vsdudakov/fastadmin"
        url: "https://github.com/vsdudakov/fastadmin"
        stars: "600+"
        license: "MIT"
        relevance: "P2"
        key_concepts:
