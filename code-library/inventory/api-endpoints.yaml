  # ============================================================
  reports:
    prefix: /reports
    tags: ["reports"]
    file: backend/routers/reports.py
    sot_ref: "API_SOT.md v9.0 §14"
    endpoints:
      - method: GET
        path: /reports/dashboard
        summary: 获取仪表盘摘要
        permissions: authenticated
        response_status: 200
      - method: GET
        path: /reports/performance
        summary: 获取效果报表
        permissions: authenticated
        query_params: [start_date, end_date, project_ids, channel_ids]
        response_status: 200
      - method: GET
        path: /reports/profit
        summary: 获取利润报表
        permissions: [admin, finance]
        query_params: [start_date, end_date, project_ids]
        response_status: 200
      - method: GET
        path: /reports/reconciliation
        summary: 获取对账报表
        permissions: [admin, finance]
        query_params: [start_date, end_date]
        response_status: 200
      - method: GET
        path: /reports/financial
        summary: 获取财务摘要
        permissions: [admin, finance]
        query_params: [start_date, end_date, project_ids]
        response_status: 200
      - method: GET
        path: /reports/trends/{metric}
        summary: 获取趋势报表
        permissions: authenticated
        path_params: [metric]
