  frontend:
    description: "下载按钮 + Blob 处理"
    code_template: |
      async function exportToExcel(params: ExportParams) {
        const response = await fetch(`/api/v1/daily-reports/export?${new URLSearchParams(params)}`, {
          headers: { Authorization: `Bearer ${token}` },
        });

        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `export_${new Date().toISOString().split('T')[0]}.xlsx`;
        a.click();
        window.URL.revokeObjectURL(url);
      }
